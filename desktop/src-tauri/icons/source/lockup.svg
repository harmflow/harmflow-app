<svg xmlns="http://www.w3.org/2000/svg" width="2152.75" height="512" viewBox="0 0 2152.75 512">
  <!-- HarmFlow lockup: the mark and the wordmark side by side, the mark on the left. The mark is
       app-icon-small.svg's drawing, the one made for small sizes, on its 512-unit tile; the wordmark is
       wordmark.svg's outlines, its ink 46% of the tile's height and centered on it, after a gap of a fifth of the
       tile. For dark backgrounds only, as wordmark.svg is. -->
  <defs>
    <linearGradient id="mark-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a15"/>
      <stop offset="1" stop-color="#0d1328"/>
    </linearGradient>
    <radialGradient id="mark-glow-cyan">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".26"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mark-glow-magenta">
      <stop offset="0" stop-color="#e040fb" stop-opacity=".24"/>
      <stop offset="1" stop-color="#e040fb" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mark-neon" gradientUnits="userSpaceOnUse" x1="128" y1="0" x2="384" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#e040fb"/>
    </linearGradient>
    <linearGradient id="mark-core" gradientUnits="userSpaceOnUse" x1="128" y1="0" x2="384" y2="0">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset=".5" stop-color="#f1edff"/>
      <stop offset="1" stop-color="#fdf2ff"/>
    </linearGradient>

    <linearGradient id="mark-flow-fade" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="456" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".235" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".765" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="mark-flow-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect x="56" width="400" height="512" fill="url(#mark-flow-fade)"/>
    </mask>

    <clipPath id="mark-tile">
      <rect width="512" height="512" rx="115"/>
    </clipPath>

    <path id="mark-stems" d="M150 128V384M362 128V384"/>
    <path id="mark-wave" d="M44 256q53 104 106 0t106 0t106 0t106 0"/>

    <linearGradient id="wordmark-flow" gradientUnits="userSpaceOnUse" x1="676.62" y1="0" x2="1248.12" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#e040fb"/>
    </linearGradient>
  </defs>

  <!-- The mark -->
  <g clip-path="url(#mark-tile)">
    <rect width="512" height="512" fill="url(#mark-bg)"/>
    <circle cx="96" cy="80" r="340" fill="url(#mark-glow-cyan)"/>
    <circle cx="440" cy="448" r="340" fill="url(#mark-glow-magenta)"/>

    <g fill="none" stroke-linecap="round" transform="translate(256 256) scale(1.15) translate(-256 -256)">
      <g stroke="url(#mark-neon)">
        <use href="#mark-stems" stroke-width="60"/>
        <use href="#mark-wave" stroke-width="46" mask="url(#mark-flow-mask)"/>
      </g>
      <g stroke="url(#mark-core)">
        <use href="#mark-stems" stroke-width="20"/>
        <use href="#mark-wave" stroke-width="14" mask="url(#mark-flow-mask)"/>
      </g>
    </g>
  </g>
  <rect x=".75" y=".75" width="510.5" height="510.5" rx="114.25" fill="none" stroke="#22d3ee" stroke-opacity=".18"
        stroke-width="1.5"/>

  <!-- The wordmark, in wordmark.svg's coordinates -->
  <g transform="translate(599.47 370.03) scale(1.244491)">
