[package]
name = "harmflow-desktop"
version = "0.1.0"
description = "HarmFlow desktop: the dashboard and tray of the HarmFlow daemon"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "harmflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-dialog = "2.4"
tauri-plugin-notification = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures-util = "0.3"
dirs = "7"

# The debug build's test control channel reads back the notices macOS delivered (src/test_control.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSEnumerator", "NSString", "NSUserNotification"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
