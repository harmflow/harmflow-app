[package]
name = "harmflow-desktop"
version = "0.1.0"
description = "HarmFlow desktop: the dashboard and tray of the HarmFlow daemon"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "harmflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-dialog = "2.4"
tauri-plugin-notification = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures-util = "0.3"
dirs = "7"

# The tests run the registration point on Tauri's mock runtime (src/registration.rs). The feature adds no crate, and
# only the test builds take it.
[dev-dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "test"] }

# The debug build's test control channel reads the app menu macOS shows, quits as the Dock does, reads back the
# notices macOS delivered, reads the tray's status item and its menu macOS shows, and reads the window list
# (src/test_control.rs). All of them are already in the lockfile through Tauri.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSBitmapImageRep", "NSButton", "NSControl", "NSEvent", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSResponder", "NSStatusBarButton", "NSStatusItem", "NSView"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGWindow"] }
objc2-foundation = { version = "0.3", features = ["block2", "NSArray", "NSBundle", "NSData", "NSDate", "NSDictionary", "NSEnumerator", "NSObjCRuntime", "NSRunLoop", "NSString", "NSUserNotification", "NSValue"] }

# The tests of the tray command encode the tray's images as the tray-icon crate hands them to macOS. Already in the
# lockfile through Tauri.
[target.'cfg(target_os = "macos")'.dev-dependencies]
png = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
