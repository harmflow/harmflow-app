apiVersion: harmflow/v1alpha1
kind: TaskTemplate
metadata:
  id: hf-github-issues
  name:
    pt-BR: Tarefa do GitHub em branco
    en-US: Blank GitHub task
    es-ES: Tarea de GitHub en blanco
  description:
    pt-BR: Trabalha repositórios do GitHub com o prompt, os agentes e as skills que a tarefa traz.
    en-US: Works GitHub repositories with the prompt, agents, and skills the task brings.
    es-ES: Trabaja repositorios de GitHub con el prompt, los agentes y las skills que trae la tarea.
spec:
  type: github
  # The task brings its own prompt, agents, and skills: the template selects no agent.
  harness:
    preferred:
      provider: claude-code
  github:
    # One repository for the task editor to ask for.
    repositories:
      - baseBranch: main
