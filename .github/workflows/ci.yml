# CI follows D-091: a pull request runs only the parts it touches, a change in contracts/ runs every part, and main
# runs everything. The full macOS, Linux, and Windows matrix of D-091 starts when the Linux and Windows ports exist;
# until then every job runs on macOS, the MVP's only platform.
#
# Every action is pinned to a full commit SHA, with the release it corresponds to in a comment, so a moved tag cannot
# change what CI runs; a new action follows the same rule. Dependabot (.github/dependabot.yml) proposes the updates.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels that pull request's run still going. A run on main, or a dispatch, is the
# record for its own commit, so it is keyed on the commit and never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Parts touched
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.parts.outputs.contracts }}
      daemon: ${{ steps.parts.outputs.daemon }}
      integration: ${{ steps.parts.outputs.integration }}
      desktop: ${{ steps.parts.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: parts
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            files="everything"
          else
            files=$(git diff --name-only "origin/$BASE...HEAD")
          fi
          echo "$files"
          touched() {
            # Everything runs on main, and for a change to contracts/, the build, or CI itself.
            [ "$files" = "everything" ] && return 0
            echo "$files" | grep -Eq '^(contracts/|Makefile$|\.github/)' && return 0
            echo "$files" | grep -Eq "$1"
          }
          for part in contracts daemon integration desktop; do
            case $part in
              contracts)   pattern='^(contracts/|daemon/internal/contracts/|desktop/ui/src/api/generated\.ts$)' ;;
              daemon)      pattern='^daemon/' ;;
              integration) pattern='^(daemon/|tests/|agents/|skills/)' ;;
              desktop)     pattern='^(desktop/|agents/|skills/)' ;;
            esac
            if touched "$pattern"; then echo "$part=true" >> "$GITHUB_OUTPUT"; else echo "$part=false" >> "$GITHUB_OUTPUT"; fi
          done

  security:
    name: Security (changed commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          gitleaks version
      - name: Scan changed commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          else
            range="HEAD^..HEAD"
          fi
          gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="$range" --exit-code 1

  generated:
    name: Generated code is current
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: make deps
      - run: make check-generated

  daemon:
    name: Daemon (macOS)
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Formatting
        run: test -z "$(gofmt -l daemon tests)" || { gofmt -l daemon tests; exit 1; }
      # gofmt sorts imports within a group but neither splits nor orders groups. This checks the Go guide's three
      # (D-132): standard library, third party, then the module's own. Run it locally with the same command.
      - name: Import groups
        run: make check-imports
      - name: Go vulnerability audit
        working-directory: daemon
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - run: make test-daemon
        env:
          GOFLAGS: -race

  integration:
    name: Integration (macOS)
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Go vulnerability audit
        working-directory: tests
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      # The integration tests, and the daemon's coverage held against daemon/coverage-floors.txt (ADR-015). This is
      # the only job where the unit and integration data can both exist; the daemon job keeps -race.
      - run: make coverage-daemon

  desktop:
    name: Desktop (macOS)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      # The action has no releases, so this SHA is a commit of its `stable` branch, which Dependabot cannot update:
      # refresh it by hand. The toolchain comes from the input, not from the ref.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
      - run: make deps
      - name: JavaScript dependency audit
        run: pnpm -C desktop audit --audit-level high
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-audit
      - name: Rust dependency audit
        run: cargo audit --file desktop/src-tauri/Cargo.lock
      # The bundle's sidecar must exist for tauri-build, and the interface for the shell.
      - run: make sidecar
      - run: pnpm -C desktop build
      - run: pnpm -C desktop typecheck
      # The unit tests of the interface and the shell, their coverage held against its floors (ADR-015).
      - run: make coverage-desktop
