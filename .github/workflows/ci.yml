# A pull request runs only the parts it touches, a change in contracts/ runs every part, and main runs everything.
# The full macOS, Linux, and Windows matrix starts when the Linux and Windows ports exist; until then every job runs
# on macOS, the MVP's only platform.
#
# Every action is pinned to a full commit SHA, with the release it corresponds to in a comment, so a moved tag cannot
# change what CI runs; a new action follows the same rule. Dependabot (.github/dependabot.yml) proposes the updates.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels that pull request's run still going. A run on main, or a dispatch, is the
# record for its own commit, so it is keyed on the commit and never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Parts touched
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.parts.outputs.contracts }}
      daemon: ${{ steps.parts.outputs.daemon }}
      integration: ${{ steps.parts.outputs.integration }}
      desktop: ${{ steps.parts.outputs.desktop }}
      packaging: ${{ steps.parts.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: parts
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            files="everything"
          else
            files=$(git diff --name-only "origin/$BASE...HEAD")
          fi
          echo "$files"
          touched() {
            # Everything runs on main, and for a change to contracts/, the build, or CI itself.
            [ "$files" = "everything" ] && return 0
            echo "$files" | grep -Eq '^(contracts/|Makefile$|\.github/)' && return 0
            echo "$files" | grep -Eq "$1"
          }
          for part in contracts daemon integration desktop packaging; do
            case $part in
              contracts)   pattern='^(contracts/|daemon/internal/contracts/|desktop/ui/src/api/generated\.ts$)' ;;
              daemon)      pattern='^daemon/' ;;
              integration) pattern='^(daemon/|tests/|agents/|skills/)' ;;
              desktop)     pattern='^(desktop/|agents/|skills/)' ;;
              packaging)   pattern='^packaging/' ;;
            esac
            if touched "$pattern"; then echo "$part=true" >> "$GITHUB_OUTPUT"; else echo "$part=false" >> "$GITHUB_OUTPUT"; fi
          done

  # Every run, whatever the change touches: a new file can land in any part. Run it locally with the same command.
  file-names:
    name: File names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/go.mod
          cache-dependency-path: tests/go.sum
      - run: make check-file-names

  # Every change runs it, whatever parts it touches: a secret can land in any path. A pull request scans its own
  # commits, and a push to main every commit it brought, so each commit of a rebase merge is read. The weekly Security
  # workflow reads the whole history.
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: .github/scripts/install-gitleaks.sh
      - name: Scan the new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case $EVENT_NAME in
            pull_request) range="$BASE_SHA..$HEAD_SHA" ;;
            # A force push can leave the commit main was at outside the clone: the whole history is read then.
            push) if git cat-file -e "$BEFORE_SHA^{commit}"; then range="$BEFORE_SHA..$GITHUB_SHA"; else range=$GITHUB_SHA; fi ;;
            # A dispatch runs CI again on one commit, and reads that commit.
            *) range="$GITHUB_SHA^..$GITHUB_SHA" ;;
          esac
          gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="$range"

  generated:
    name: Generated code is current
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: make deps
      - run: make check-generated

  daemon:
    name: Daemon (macOS)
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Formatting
        run: test -z "$(gofmt -l daemon tests)" || { gofmt -l daemon tests; exit 1; }
      # gofmt sorts imports within a group but neither splits nor orders groups. This checks the Go guide's three:
      # standard library, third party, then the module's own. Run it locally with the same command.
      - name: Import groups
        run: make check-imports
      - run: make test-daemon
        env:
          GOFLAGS: -race
      # The known vulnerabilities the code calls, in its modules and in the Go it is built with (govulncheck). Last, so
      # a new advisory leaves the tests' results in place.
      - name: Vulnerabilities
        run: make audit-daemon

  integration:
    name: Integration (macOS)
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      # The integration tests, and the daemon's coverage held against daemon/coverage-floors.txt. This is
      # the only job where the unit and integration data can both exist; the daemon job keeps -race.
      - run: make coverage-daemon
      - name: Vulnerabilities
        run: make audit-tests

  desktop:
    name: Desktop (macOS)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      # The action has no releases, so this SHA is a commit of its `stable` branch, which Dependabot cannot update:
      # refresh it by hand. The toolchain comes from the input, not from the ref.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov,cargo-audit
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Cargo's output is target.noindex, as .cargo/config.toml sets it, not the default target.
          workspaces: desktop/src-tauri -> target.noindex
      - run: make deps
      - run: pnpm -C desktop build
      - run: pnpm -C desktop typecheck
      # The unit tests of the interface and the shell, their coverage held against its floors. The target builds the
      # bundle's sidecar first, which tauri-build needs, as it does for a contributor.
      - run: make coverage-desktop
      # The advisories against the interface's and the shell's dependencies; -k runs the second when the first fails.
      - name: Vulnerabilities
        run: make -k audit-desktop

  packaging:
    name: Packaging (macOS)
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make test-packaging
