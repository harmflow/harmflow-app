# Each change runs only the parts it touches: a pull request, the parts its diff against its base touches, and a push to
# main, the parts it changed since the commit main was at, so a merge runs again only what its pull request ran. A
# change to contracts/, the Makefile, or this workflow runs every part, and so does a dispatch. This repository's CI checks Linux only: every job runs on Linux, and every other platform is built and checked
# outside this repository. Development stays on macOS. A test that needs another platform skips here, naming what it
# needs (docs/go-code-guide.md, "Tests by platform"). make test-packaging, which tests the Mac's own make update-app, is a
# local check on the Mac.
#
# Every action is pinned to a full commit SHA, with the release it corresponds to in a comment, so a moved tag cannot
# change what CI runs; a new action follows the same rule. Dependabot (.github/dependabot.yml) proposes the updates.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels that pull request's run still going. A run on main, or a dispatch, is the
# record for its own commit, so it is keyed on the commit and never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Parts touched
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.parts.outputs.contracts }}
      daemon: ${{ steps.parts.outputs.daemon }}
      integration: ${{ steps.parts.outputs.integration }}
      desktop: ${{ steps.parts.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: parts
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case $EVENT in
            pull_request) files=$(git diff --name-only "origin/$BASE...HEAD") ;;
            # A push to main, every commit it brought: a rebase merge brings each of its pull request's commits. A force
            # push can leave the commit main was at outside the clone, and every part runs then.
            push) if git cat-file -e "$BEFORE^{commit}"; then files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA"); else files="everything"; fi ;;
            # A dispatch runs CI again by hand, on every part.
            *) files="everything" ;;
          esac
          echo "$files"
          touched() {
            # Every part runs on a dispatch, and for a change to contracts/, the build, or this workflow. The rest of
            # .github/ is read by no part's job: the secret scan, which reads its script, runs on every change.
            [ "$files" = "everything" ] && return 0
            echo "$files" | grep -Eq '^(contracts/|Makefile$|\.github/workflows/ci\.yml$)' && return 0
            echo "$files" | grep -Eq "$1"
          }
          for part in contracts daemon integration desktop; do
            case $part in
              contracts)   pattern='^(contracts/|daemon/internal/contracts/|desktop/ui/src/api/generated\.ts$|desktop/codegen/|desktop/pnpm-lock\.yaml$|desktop/pnpm-workspace\.yaml$)' ;;
              daemon)      pattern='^(daemon/|templates/|agents/)' ;;
              integration) pattern='^(daemon/|tests/|agents/|skills/|templates/)' ;;
              # .cargo/config.toml sets where Cargo builds the shell.
              desktop)     pattern='^(desktop/|agents/|skills/|templates/|\.cargo/)' ;;
            esac
            if touched "$pattern"; then echo "$part=true" >> "$GITHUB_OUTPUT"; else echo "$part=false" >> "$GITHUB_OUTPUT"; fi
          done

  # Every run, whatever the change touches: a new file can land in any part. Run it locally with the same command.
  file-names:
    name: File names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/go.mod
          cache-dependency-path: tests/go.sum
      - run: make check-file-names
      # Every run too: a template's text can be written into the daemon's or the desktop's source by a change to
      # either, and only its file may hold it.
      - name: Template texts
        run: make check-template-texts

  # Every change runs it, whatever parts it touches: a secret can land in any path. A pull request scans its own
  # commits, and a push to main every commit it brought, so each commit of a rebase merge is read. The weekly Security
  # workflow reads the whole history.
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: .github/scripts/install-gitleaks.sh
      - name: Scan the new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case $EVENT_NAME in
            pull_request) range="$BASE_SHA..$HEAD_SHA" ;;
            # A force push can leave the commit main was at outside the clone: the whole history is read then.
            push) if git cat-file -e "$BEFORE_SHA^{commit}"; then range="$BEFORE_SHA..$GITHUB_SHA"; else range=$GITHUB_SHA; fi ;;
            # A dispatch runs CI again on one commit, and reads that commit.
            *) range="$GITHUB_SHA^..$GITHUB_SHA" ;;
          esac
          gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="$range"

  generated:
    name: Generated code is current
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: make deps
      - run: make check-generated

  # go vet and the audit of the daemon. Its unit tests run in the integration job, once: every path of the daemon part
  # is a path of the integration part, so a change that runs this job runs that one too.
  daemon:
    name: Daemon (Linux)
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - run: make vet-daemon
      # The known vulnerabilities the code calls, in its modules and in the Go it is built with (govulncheck). Last, so
      # a new advisory leaves vet's result in place. It reads the Linux build; every other platform's audit runs
      # outside this repository.
      - name: Vulnerabilities
        run: make audit-daemon

  integration:
    name: Integration (Linux)
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      # The formatting of both Go modules, here alone: every change that runs the daemon job runs this one, and a change
      # to tests/ alone runs only this one.
      - name: Formatting
        run: test -z "$(gofmt -l daemon tests)" || { gofmt -l daemon tests; exit 1; }
      # gofmt sorts imports within a group but neither splits nor orders groups. This checks the Go guide's three:
      # standard library, third party, then the module's own. Run it locally with the same command.
      - name: Import groups
        run: make check-imports
      # The daemon's unit tests with -race, beside the integration tests, and the daemon's coverage from both held
      # against daemon/coverage-floors.txt. This is the only job where the unit and integration data can both exist,
      # so the unit tests run here and nowhere else in CI.
      - run: make coverage-daemon COVERAGE_UNIT_FLAGS=-race
      - name: Vulnerabilities
        run: make audit-tests

  desktop:
    name: Desktop (Linux)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Tauri's Linux prerequisites, as its documentation lists them for Debian and Ubuntu: WebKitGTK for the window,
      # the app-indicator library for the tray, and what the rest of its Linux build links.
      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      # The action has no releases, so this SHA is a commit of its `stable` branch, which Dependabot cannot update:
      # refresh it by hand. The toolchain comes from the input, not from the ref.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-llvm-cov,cargo-audit
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Cargo's output is target.noindex, as .cargo/config.toml sets it, not the default target.
          workspaces: desktop/src-tauri -> target.noindex
      - run: make deps
      # The interface's bundle, which tauri-build embeds. Its script type-checks the interface first (tsc --noEmit), so
      # no step runs pnpm typecheck.
      - run: pnpm -C desktop build
      # The unit tests of the interface and the shell, their coverage held against its floors. The target builds the
      # bundle's sidecar first, which tauri-build needs, as it does for a contributor.
      - run: make coverage-desktop
      # The dashboard's store and timeline against a real harmflowd built from this tree, with the stand-in harnesses
      # of the integration suite. Apart from coverage-desktop, whose unit run and floors must not need a daemon.
      - run: make test-desktop-daemon
      # The advisories against the interface's and the shell's dependencies; -k runs the second when the first fails.
      - name: Vulnerabilities
        run: make -k audit-desktop
