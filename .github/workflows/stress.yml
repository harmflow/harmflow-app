# Runs the daemon's unit tests and the integration suite every night beside a fixed CPU load, and shows in the run's
# summary how each suite did under it. A test that fails here is a defect of that test, and this load is the heaviest
# the suites are held to; a development machine adds none. It is no check: it never runs on a pull request or a push,
# and no ruleset requires it. The job fails only when a test does, and it writes no file, floor, or issue. Like CI, it
# runs on macOS, the MVP's only platform.
#
# The load and the repetitions are the env block below; .github/scripts/stress.sh runs each step.
# Actions are pinned as in ci.yml, to the same commits.
name: Stress

on:
  schedule:
    - cron: "47 6 * * *" # 03:47 in São Paulo, after the Coverage workflow
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    name: Daemon and integration under load (macOS)
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      # Busy processes per core of the runner, and how many times each suite runs.
      LOAD_PER_CORE: 2
      COUNT: 3
      # go test's limit for each suite's whole run, all its repetitions included.
      DAEMON_TIMEOUT: 45m
      INTEGRATION_TIMEOUT: 90m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Start the load
        run: .github/scripts/stress.sh load-start
      - id: daemon
        name: Daemon unit tests, with -race
        continue-on-error: true
        run: .github/scripts/stress.sh run daemon
      - id: integration
        name: Integration tests
        continue-on-error: true
        run: .github/scripts/stress.sh run integration
      - name: Stop the load
        if: ${{ always() }}
        run: .github/scripts/stress.sh load-stop
      - name: Summary
        if: ${{ !cancelled() }}
        run: .github/scripts/stress.sh summary >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: stress-logs
          path: build/stress/
          retention-days: 30
          if-no-files-found: ignore
      - name: Fail when a suite failed
        if: ${{ steps.daemon.outcome == 'failure' || steps.integration.outcome == 'failure' }}
        env:
          DAEMON: ${{ steps.daemon.outcome }}
          INTEGRATION: ${{ steps.integration.outcome }}
        run: |
          echo "daemon: $DAEMON, integration: $INTEGRATION"
          exit 1
