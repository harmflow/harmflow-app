# Runs the daemon's unit tests and the integration suite every night in two jobs, and shows in each run summary how
# each suite did: repeated ten times with nothing beside them, which catches a test whose result depends on timing
# without any load, and three times beside a fixed CPU load. A test that fails here is a defect of that test, and
# these runs are the repetitions and the heaviest load the suites are held to; a development machine runs a test once
# and adds no load. It is no check: it never runs on a pull request or a push, and no ruleset requires it. A job fails
# only when a test does, and it writes no file, floor, or issue. Like CI, it runs on Linux, and a test that needs macOS
# skips here.
#
# The load and the repetitions are each job's row of the matrix below; .github/scripts/stress.sh runs each step.
# Actions are pinned as in ci.yml, to the same commits.
name: Stress

on:
  schedule:
    - cron: "47 6 * * *" # 03:47 in São Paulo, after the Coverage workflow
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    name: Daemon and integration ${{ matrix.title }} (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Busy processes per core of the runner, and how many times each suite runs.
        include:
          - mode: repeated
            title: repeated, no load
            load-per-core: 0
            count: 10
          - mode: loaded
            title: under load
            load-per-core: 2
            count: 3
    env:
      LOAD_PER_CORE: ${{ matrix.load-per-core }}
      COUNT: ${{ matrix.count }}
      # go test's limit for each suite's whole run, all its repetitions included.
      DAEMON_TIMEOUT: 45m
      INTEGRATION_TIMEOUT: 90m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Start the load
        run: .github/scripts/stress.sh load-start
      - id: daemon
        name: Daemon unit tests, with -race
        continue-on-error: true
        run: .github/scripts/stress.sh run daemon
      - id: integration
        name: Integration tests
        continue-on-error: true
        run: .github/scripts/stress.sh run integration
      - name: Stop the load
        if: ${{ always() }}
        run: .github/scripts/stress.sh load-stop
      - name: Summary
        if: ${{ !cancelled() }}
        run: .github/scripts/stress.sh summary >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: stress-logs-${{ matrix.mode }}
          path: build/stress/
          retention-days: 30
          if-no-files-found: ignore
      - name: Fail when a suite failed
        if: ${{ steps.daemon.outcome == 'failure' || steps.integration.outcome == 'failure' }}
        env:
          DAEMON: ${{ steps.daemon.outcome }}
          INTEGRATION: ${{ steps.integration.outcome }}
        run: |
          echo "daemon: $DAEMON, integration: $INTEGRATION"
          exit 1
