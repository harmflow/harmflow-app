# Reads the coverage of main every night and shows it in the run's summary, each reading beside its floor, so a floor
# with room to rise is seen without a reading by hand. It is a view beside the coverage ratchet, never the check: the
# floors stay held by the CI jobs that run the tests, and nothing here fails on a figure (HOLD_FLOORS=). A job fails
# only when a test does. Like CI, every job runs on macOS, the MVP's only platform.
#
# Actions are pinned as in ci.yml, to the same commits.
name: Coverage

on:
  schedule:
    - cron: "17 6 * * *" # 03:17 in São Paulo
  workflow_dispatch:
  # A change to the report runs it, so its pull request shows the summary it writes.
  pull_request:
    paths:
      - .github/workflows/coverage.yml
      - .github/scripts/coverage-summary.sh

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon:
    name: Daemon (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - id: coverage
        run: make coverage-daemon HOLD_FLOORS=
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.coverage.outcome }}
        run: .github/scripts/coverage-summary.sh daemon >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-daemon
          path: |
            build/coverage/daemon.html
            build/coverage/daemon.out
          retention-days: 30
          if-no-files-found: ignore

  desktop:
    name: Desktop (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      # The action has no releases, so this SHA is a commit of its `stable` branch, which Dependabot cannot update:
      # refresh it by hand, with the one in ci.yml. The toolchain comes from the input, not from the ref.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Cargo's output is target.noindex, as .cargo/config.toml sets it, not the default target.
          workspaces: desktop/src-tauri -> target.noindex
      - run: make deps
      # The bundle's sidecar must exist for tauri-build, and the interface for the shell.
      - run: make sidecar
      - run: pnpm -C desktop build
      - id: coverage
        run: make coverage-desktop HOLD_FLOORS=
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.coverage.outcome }}
        run: .github/scripts/coverage-summary.sh desktop >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-desktop
          path: |
            desktop/ui/coverage/
            build/coverage/rust/
          retention-days: 30
          if-no-files-found: ignore
