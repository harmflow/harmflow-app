openapi: 3.1.0
info:
  title: HarmFlow local API
  version: v1
  description: |
    The only control surface of the HarmFlow daemon, on HTTP bound to 127.0.0.1 with Server-Sent Events
    for the live stream. The daemon picks a free port at start and writes it, with its pid and version, to
    a runtime file only the user can read.

    Every request, the SSE stream included, carries the per-installation token in `Authorization: Bearer <token>`.
    Requests whose `Host` is not the loopback address, or whose `Origin` is a web page, are rejected.

    Naming uses plural resources, actions as a POST to a verb sub-resource, camelCase keys, snake_case
    values from closed sets, and `object.action` event types.
servers:
  - url: http://127.0.0.1:{port}/api/v1
    variables:
      port:
        default: "0"
        description: The port written to the runtime file.
security:
  - bearerToken: []
tags:
  - name: daemon
  - name: harnesses
  - name: tasks
  - name: executions
  - name: events
  - name: queue
  - name: settings
  - name: notifications

paths:
  /health:
    get:
      tags: [daemon]
      operationId: getHealth
      summary: Daemon state and version
      responses:
        "200":
          description: The daemon is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /daemon/stop:
    post:
      tags: [daemon]
      operationId: stopDaemon
      summary: Stop the daemon
      description: Refused with 409 while executions run, unless force is set; the desktop asks for confirmation first.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean, default: false }
      responses:
        "202":
          description: The daemon is stopping.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "409": { $ref: "#/components/responses/Conflict" }

  /diagnostics:
    get:
      tags: [daemon]
      operationId: getDiagnostics
      summary: Directories, address, and token store
      responses:
        "200":
          description: Diagnostics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Diagnostics" }

  /stats:
    get:
      tags: [executions]
      operationId: getStats
      summary: Counters for the executions screen
      responses:
        "200":
          description: Counters and their recent activity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }

  /harnesses:
    get:
      tags: [harnesses]
      operationId: listHarnesses
      summary: Detected harnesses and their capabilities
      responses:
        "200":
          description: One entry per supported harness, detected or not.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Harness" }

  /harnesses/refresh:
    post:
      tags: [harnesses]
      operationId: refreshHarnesses
      summary: Detect the harnesses again
      responses:
        "200":
          description: The refreshed inventory.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Harness" }

  /harnesses/{harnessId}:
    parameters:
      - $ref: "#/components/parameters/HarnessId"
    put:
      tags: [harnesses]
      operationId: setHarnessPath
      summary: Choose an installation or set a path by hand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  description: >-
                    Absolute path of the CLI, an executable file whose --version output names the harness;
                    null returns to automatic detection.
                  type: [string, "null"]
      responses:
        "200":
          description: The harness, revalidated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Harness" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }

  /tools:
    get:
      tags: [harnesses]
      operationId: listTools
      summary: Git and gh as found in the environment
      responses:
        "200":
          description: Tools the built-in skills use.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tool" }

  /catalog:
    get:
      tags: [tasks]
      operationId: getCatalog
      summary: Agents and skills a task can cite, built in or the user's
      parameters:
        - name: workspace
          in: query
          required: false
          description: >-
            The folder a harness that finds the user's items per workspace, such as Codex for its skills, lists them
            for: a task's workspace path, expanded as the task's paths are. HarmFlow's workspace root when absent.
          schema: { type: string }
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }

  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: List tasks
      responses:
        "200":
          description: Every task, with its next firing and latest execution.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaskSummary" }
    post:
      tags: [tasks]
      operationId: createTask
      summary: Create and validate a task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "201":
          description: The task was written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /tasks/validate:
    post:
      tags: [tasks]
      operationId: validateTask
      summary: Validate YAML or form input with the one schema the form, the editor, and import share
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "200":
          description: The result, valid or not.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationResult" }

  /tasks/import:
    post:
      tags: [tasks]
      operationId: importTask
      summary: Import a portable task YAML
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml]
              properties:
                yaml: { type: string }
                overwrite: { type: boolean, default: false }
      responses:
        "201":
          description: The imported task; warnings name the agents and skills this machine lacks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [tasks]
      operationId: getTask
      summary: Get a task's definition
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [tasks]
      operationId: updateTask
      summary: Update a task
      description: baseRevision must be the revision the edit started from; a file changed meanwhile is a conflict, never a silent overwrite.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "200":
          description: The task was written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [tasks]
      operationId: deleteTask
      summary: Delete a task
      description: A running task is deleted once its execution finishes; its execution records stay.
      responses:
        "202":
          description: Deletion waits for the running execution.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "204":
          description: The task was deleted.
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/run:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [tasks]
      operationId: runTask
      summary: Manual trigger
      responses:
        "202":
          description: The execution was created, or the firing waits or was coalesced or skipped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FiringResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tasks/{taskId}/duplicate:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [tasks]
      operationId: duplicateTask
      summary: Duplicate a task, disabled, with a new identifier
      responses:
        "201":
          description: The copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/enable:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [tasks]
      operationId: enableTask
      summary: Enable a task
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/disable:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [tasks]
      operationId: disableTask
      summary: Disable a task; a running execution finishes normally
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/export:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [tasks]
      operationId: exportTask
      summary: Portable YAML, with no secrets, logs, or state
      responses:
        "200":
          description: The task's YAML.
          content:
            application/yaml:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /schedules/preview:
    post:
      tags: [tasks]
      operationId: previewSchedule
      summary: The next occurrences of a schedule, in its time zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schedule]
              properties:
                schedule: { $ref: "#/components/schemas/ScheduleInput" }
                count: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        "200":
          description: Occurrences, or the error that prevents computing them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchedulePreview" }

  /executions:
    get:
      tags: [executions]
      operationId: listExecutions
      summary: List executions, newest first
      parameters:
        - { name: taskId, in: query, schema: { type: string } }
        - name: status
          in: query
          description: Comma-separated statuses.
          schema: { type: string }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - name: before
          in: query
          description: Only executions created before this time.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Executions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExecutionSummary" }

  /executions/{executionId}:
    parameters:
      - $ref: "#/components/parameters/ExecutionId"
    get:
      tags: [executions]
      operationId: getExecution
      summary: Execution details
      responses:
        "200":
          description: The execution record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Execution" }
        "404": { $ref: "#/components/responses/NotFound" }

  /executions/{executionId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ExecutionId"
    post:
      tags: [executions]
      operationId: cancelExecution
      summary: Cancel one execution; the others continue
      responses:
        "202":
          description: Cancellation was recorded and is being carried out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /executions/{executionId}/events:
    parameters:
      - $ref: "#/components/parameters/ExecutionId"
    get:
      tags: [events]
      operationId: listExecutionEvents
      summary: Replay an execution's stored events
      parameters:
        - name: after
          in: query
          description: Only events whose id is greater.
          schema: { type: integer, minimum: 0 }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 2000 } }
      responses:
        "200":
          description: Events in order; logExpired is true when retention removed the log.
          content:
            application/json:
              schema:
                type: object
                required: [events, logExpired]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
                  logExpired: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }

  /executions/{executionId}/output:
    parameters:
      - $ref: "#/components/parameters/ExecutionId"
    get:
      tags: [executions]
      operationId: getExecutionOutput
      summary: The harness's raw output, one capture per attempt, redacted
      description: |
        What the CLI printed on stdout and stderr, as the daemon captured it, with secrets masked. Each capture is the
        end of its attempt's output, at most `limit` bytes, starting at a line. While the execution runs the captures
        grow; ask again for a live view.
      parameters:
        - name: limit
          in: query
          description: Bytes of each attempt's capture to return, counted from its end.
          schema: { type: integer, minimum: 1, maximum: 8388608, default: 1048576 }
      responses:
        "200":
          description: One capture per attempt, in order; logExpired is true when retention removed them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionOutput" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/stream:
    get:
      tags: [events]
      operationId: streamEvents
      summary: SSE stream of events
      description: |
        Each message is `id: <event id>`, `event: <type>`, `data: <Event JSON>`. A client that reconnects sends
        `Last-Event-ID` (or `after`) and first receives the buffered events after it; an `event: replay_gap` message
        means older events must be fetched per execution.
      parameters:
        - { name: after, in: query, schema: { type: integer, minimum: 0 } }
        - { name: Last-Event-ID, in: header, schema: { type: string } }
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema: { type: string }

  /queue:
    get:
      tags: [queue]
      operationId: getQueue
      summary: Waiting firings, upcoming firings, and the work items of each task
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Queue" }

  /settings:
    get:
      tags: [settings]
      operationId: getSettings
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    patch:
      tags: [settings]
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsPatch" }
      responses:
        "200":
          description: Settings after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "422": { $ref: "#/components/responses/Invalid" }

  /settings/token/rotate:
    post:
      tags: [settings]
      operationId: rotateToken
      summary: Replace the API token; the response is the last one the old token authorizes
      responses:
        "200":
          description: The token was replaced in the credential store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }

  /workspaces/clean:
    post:
      tags: [settings]
      operationId: cleanWorkspaces
      summary: Remove the worktrees no longer needed
      responses:
        "200":
          description: What was removed and what was kept.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanResult" }

  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Notices, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }

  /notifications/read:
    post:
      tags: [notifications]
      operationId: markNotificationsRead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  description: The notices to mark read; absent marks every notice read.
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer

  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema: { type: string }
    HarnessId:
      name: harnessId
      in: path
      required: true
      schema: { type: string, enum: [claude-code, codex] }

  responses:
    Unauthorized:
      description: The token is missing or wrong.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: Validation failed; nothing was written.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    MessageKey:
      description: >-
        Names a text the daemon writes for the user. The desktop shows it in the interface's language, filling it with
        its params; the message beside it is the same text in en-US, shown for a key the desktop does not know. The
        agent's text, tool output, and a tool's own error get no key and stay as they are. A text is a message with
        messageKey and params, or a field such as errorMessage with errorKey and errorParams.
      type: string
      enum:
        # Requests and their resources
        - host_forbidden
        - origin_forbidden
        - token_required
        - route_not_found
        - body_not_json
        - task_not_found
        - execution_not_found
        - harness_not_found
        - task_exists
        - task_file_exists
        - base_revision_required
        - task_changed_on_disk
        - task_invalid
        - task_disabled
        - task_being_deleted
        - daemon_stopping
        - execution_ended
        - executions_running
        - harness_path_not_absolute
        - harness_path_not_executable
        - settings_language_invalid
        - settings_notification_level_invalid
        - settings_log_retention_invalid
        - settings_path_variable_invalid
        - settings_allowed_folder_invalid
        - settings_change_breaks_task
        - harness_not_identified
        # Task syntax
        - yaml_syntax
        - document_empty
        - document_not_json
        - document_not_representable
        - task_input_missing
        # Task schema
        - schema_type
        - schema_const
        - schema_enum
        - schema_required
        - schema_additional_properties
        - schema_pattern
        - schema_min_length
        - schema_max_length
        - schema_minimum
        - schema_maximum
        - schema_min_items
        - schema_unique_items
        - schema_not
        - schema_false
        # Task rules the schema cannot express
        - id_immutable
        - type_immutable
        - id_file_mismatch
        - task_file_invalid
        - task_file_error
        - schedule_missing
        - schedule_empty
        - schedule_cron_and_interval
        - timezone_unknown
        - interval_invalid
        - interval_unit_invalid
        - cron_seconds
        - cron_field_count
        - cron_step_invalid
        - cron_value_invalid
        - cron_value_out_of_range
        - harness_unknown
        - claude_model_unknown
        - claude_effort_unsupported
        - claude_effort_invalid
        - codex_model_unknown
        - codex_effort_invalid
        - codex_profile_unchecked
        - harness_not_detected
        - harness_not_ready
        - agent_not_found
        - skill_not_found
        - agent_missing
        - skill_missing
        - fallback_agent_missing
        - fallback_skill_missing
        - skill_list_unreadable
        - fallback_skill_list_unreadable
        - codex_app_server_missing
        - codex_app_server_start_failed
        - codex_app_server_exited
        - codex_app_server_timed_out
        - codex_app_server_error
        - fallback_repeats_preferred
        - extra_usage_unenforced
        - path_variable_unterminated
        - path_variable_undefined
        - path_not_absolute
        - path_forbidden_home
        - path_forbidden_place
        - path_outside_allowed_area
        - script_program_relative
        - script_working_directory_relative
        - local_path_missing
        - script_system_not_declared
        - script_program_not_found
        - script_working_directory_missing
        - script_imported_disabled
        # Execution warnings
        - restriction_claude_shell_workspace
        - restriction_claude_shell_network
        - restriction_claude_allow_rules
        - restriction_codex_tool_lists
        - restriction_script_unenforced
        - script_leftovers_ended
        - harness_version_untested
        - harness_version_unknown
        - quota_unread
        - repository_unprotected
        - report_not_json
        - report_schema_invalid
        # Execution steps and why an attempt started
        - step_checking_harness
        - step_preparing_workspace
        - step_starting_harness
        - step_switching_harness
        - step_waiting_rate_limit
        - step_preparing_program
        - step_running_program
        - attempt_first
        - attempt_rate_limit_retry
        - attempt_failover
        # Event messages and why an execution or attempt ended
        - daemon_started
        - daemon_signal
        - daemon_stop_requested
        - local_api_stopped
        - task_delete_pending
        - task_changed_externally
        - task_changed_externally_invalid
        - task_removed_externally
        - task_was_disabled
        - task_was_deleted
        - task_file_removed
        - task_gone
        - firing_queued
        - firing_coalesced
        - firing_skipped
        - firings_missed_catch_up
        - firings_missed_skipped
        - cancel_requested
        - cancelled_before_start
        - execution_cancelled
        - execution_timed_out
        - execution_status
        - daemon_stopped_execution
        - execution_dir_failed
        - workspace_create_failed
        - repository_path_missing
        - context_write_failed
        - harness_started
        - harness_session
        - harness_exited
        - harness_exit_code
        - harness_start_failed
        - harness_ended_with_error
        - harness_unavailable
        - harness_unavailable_readiness
        - harness_rate_limited
        - harness_quota_exhausted
        - quota_exhausted
        - quota_exhausted_until
        - extra_usage_stopped
        - harness_switched
        - no_alternative_harness
        - no_alternative_harness_detail
        - skill_delivery_failed
        - agent_delivery_failed
        - tool_succeeded
        - tool_failed
        - tests_failed
        - script_started
        - script_exit_code
        - script_signaled
        - script_start_failed
        - script_write_failed
        - process_ended
        - process_left_ended
        - process_interrupted_ended
        - task_path_refused
        # Harness and tool diagnostics
        - detection_running
        - harness_manual_path_invalid
        - claude_not_found
        - codex_not_found
        - git_not_found
        - gh_not_found
        - command_failed
        - harness_feature_missing
        - harness_version_below_minimum
        - claude_not_signed_in
        - quota_report_unrecognized
        - not_signed_in
        - authentication_unverified
        - gh_auth_problem

    MessageParams:
      description: >-
        Values the desktop interpolates into the translated text of a messageKey; a count param picks its plural form.
        A param that quotes another text the daemon wrote has a param named after it with Key appended, its key, and
        params prefixed with its name and a dot, its params, so it is translated in place too.
      type: object
      additionalProperties: { type: string }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, unauthorized, forbidden, not_found, conflict, validation_failed, task_disabled, executions_running, internal]
            message: { type: string, description: The en-US text. }
            messageKey: { $ref: "#/components/schemas/MessageKey" }
            params: { $ref: "#/components/schemas/MessageParams" }
            validation: { $ref: "#/components/schemas/ValidationResult" }
            currentRevision: { type: string }

    Accepted:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        message: { type: string }

    Health:
      type: object
      required: [status, version, apiVersion, pid, startedAt, acceptingFirings]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
        commit: { type: string, description: "The commit it was built from, 7 characters, -dirty with uncommitted changes." }
        builtAt: { type: string, format: date-time, description: "When it was built; left out when the build stamped no time." }
        apiVersion: { type: string, enum: [v1] }
        pid: { type: integer }
        startedAt: { type: string, format: date-time }
        acceptingFirings: { type: boolean }

    Diagnostics:
      type: object
      required: [version, address, homeDir, tasksDir, stateDir, logsDir, workspaceDir, runtimeFile, tokenStore, builtinsDir]
      properties:
        version: { type: string }
        address: { type: string }
        homeDir: { type: string }
        tasksDir: { type: string }
        stateDir: { type: string }
        logsDir: { type: string }
        workspaceDir: { type: string }
        runsDir: { type: string }
        runtimeFile: { type: string }
        tokenStore: { type: string, enum: [keychain, file] }
        builtinsDir: { type: string }
        diskUsageBytes: { type: integer }

    Stats:
      type: object
      required: [running, queued, completedToday, failedToday, activity]
      properties:
        running: { type: integer }
        queued: { type: integer }
        completedToday: { type: integer }
        failedToday: { type: integer }
        system:
          description: Gauges of the machine and of HarmFlow's own directory, for the sidebar foot.
          type: object
          properties:
            cpuPercent: { type: number }
            memoryUsedBytes: { type: integer }
            memoryTotalBytes: { type: integer }
            diskUsedBytes: { type: integer }
            diskTotalBytes: { type: integer }
            harmflowDirBytes: { type: integer }
        activity:
          description: Per hour, the last 12 hours, oldest first.
          type: object
          required: [running, queued, completed, failed]
          properties:
            running: { type: array, items: { type: integer } }
            queued: { type: array, items: { type: integer } }
            completed: { type: array, items: { type: integer } }
            failed: { type: array, items: { type: integer } }

    ReadinessState:
      description: checking while a harness's first check runs; a later check keeps the previous state.
      type: string
      enum: [checking, not_installed, installed, version_identified, authenticated, ready, not_ready]

    Harness:
      type: object
      required: [id, name, detected, readiness, authentication, models, efforts, lastCheckedAt, installations]
      properties:
        id: { type: string, enum: [claude-code, codex] }
        name: { type: string }
        detected: { type: boolean }
        path: { type: string, description: The resolved absolute path. }
        pathSource: { type: string, enum: [path, known_location, manual] }
        installations:
          description: >-
            The installations offered: every one detection found, on PATH and then in the known locations, and the path
            set by hand when detection did not find it.
          type: array
          items: { type: string }
        installation:
          type: string
          description: >-
            The entry of installations in use, as found or set by hand. path is where it resolves to, a symlink's
            target included.
        version: { type: string }
        versionSupport: { type: string, enum: [supported, untested_newer, below_minimum, unknown] }
        authentication: { type: string, enum: [valid, invalid, unknown] }
        readiness: { $ref: "#/components/schemas/ReadinessState" }
        models:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: string }
              efforts: { type: array, items: { type: string } }
        efforts: { type: array, items: { type: string } }
        capabilitySource: { type: string, enum: [reported, verified, declared] }
        enforceableControls:
          description: The native controls the installed version offers.
          type: array
          items: { type: string }
        lastCheckedAt: { type: string, format: date-time }
        diagnostic: { type: string, description: "What is wrong with the harness, in en-US." }
        diagnosticKey: { $ref: "#/components/schemas/MessageKey" }
        diagnosticParams: { $ref: "#/components/schemas/MessageParams" }

    Tool:
      type: object
      required: [id, detected]
      properties:
        id: { type: string, enum: [git, gh] }
        detected: { type: boolean }
        path: { type: string }
        version: { type: string }
        authentication: { type: string, enum: [valid, invalid, unknown] }
        diagnostic: { type: string, description: "What is wrong with the tool, in en-US." }
        diagnosticKey: { $ref: "#/components/schemas/MessageKey" }
        diagnosticParams: { $ref: "#/components/schemas/MessageParams" }

    CatalogEntry:
      type: object
      required: [name, kind, source, harnesses]
      properties:
        name: { type: string }
        kind: { type: string, enum: [agent, skill] }
        source: { type: string, enum: [builtin, user] }
        description: { type: string }
        harnesses:
          description: The harnesses that can load it.
          type: array
          items: { type: string }
        copy:
          $ref: "#/components/schemas/AgentCopy"

    AgentCopy:
      description: >-
        What selecting an agent copies into a task, on an agent whose file reads: its instructions become the task's
        prompt, its description the task's, its model the task's when the task's harness is among modelHarnesses, and
        its skills the task's. omittedFields names the front-matter fields a task has no place for. The task keeps hash
        as its origin, to tell when the agent changes.
      type: object
      required: [prompt, modelHarnesses, skills, omittedFields, hash]
      properties:
        prompt: { type: string }
        description: { type: string }
        model: { type: string }
        modelHarnesses:
          description: The harnesses that accept model as a task's.
          type: array
          items: { type: string }
        skills: { type: array, items: { type: string } }
        omittedFields: { type: array, items: { type: string } }
        hash: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }

    CatalogProblem:
      description: >-
        What kept a harness from listing the user's items in full: a file it reported it could not load, with its own
        message and no key, or its list that could not be read, as a text of the daemon's.
      type: object
      required: [harness, kind, message]
      properties:
        harness: { type: string }
        kind: { type: string, enum: [agent, skill] }
        path: { type: string, description: "The file the harness could not load." }
        message: { type: string }
        messageKey: { $ref: "#/components/schemas/MessageKey" }
        params: { $ref: "#/components/schemas/MessageParams" }

    Catalog:
      type: object
      required: [agents, skills, taskTypes, problems]
      properties:
        agents: { type: array, items: { $ref: "#/components/schemas/CatalogEntry" } }
        skills: { type: array, items: { $ref: "#/components/schemas/CatalogEntry" } }
        problems: { type: array, items: { $ref: "#/components/schemas/CatalogProblem" } }
        taskTypes:
          type: array
          items:
            type: object
            required: [id, parametersKey, defaultAgents, defaultSkills]
            properties:
              id: { type: string }
              parametersKey: { type: [string, "null"] }
              defaultAgents: { type: array, items: { type: string } }
              defaultSkills: { type: array, items: { type: string } }
              defaultPrompt: { type: string }

    TaskDocument:
      description: The task document of contracts/schemas/task.schema.json.
      type: object
      additionalProperties: true

    TaskInput:
      description: Either the YAML text (the editor and import) or the document (the form). Both go through the same validation.
      type: object
      properties:
        yaml: { type: string }
        document: { $ref: "#/components/schemas/TaskDocument" }
        baseRevision: { type: string, description: Required on update. }

    ValidationIssue:
      type: object
      required: [message]
      properties:
        path: { type: string, description: JSON pointer into the document. }
        message: { type: string, description: The en-US text. }
        messageKey: { $ref: "#/components/schemas/MessageKey" }
        params: { $ref: "#/components/schemas/MessageParams" }
        line: { type: integer }
        column: { type: integer }
        code: { type: string }

    ValidationResult:
      type: object
      required: [valid, errors, warnings]
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { $ref: "#/components/schemas/ValidationIssue" } }
        warnings: { type: array, items: { $ref: "#/components/schemas/ValidationIssue" } }
        document: { $ref: "#/components/schemas/TaskDocument" }
        effective:
          description: The document with every default applied.
          $ref: "#/components/schemas/TaskDocument"
        yaml: { type: string }

    Warning:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [policy_unenforced, repository_unprotected, conflicting_activity, missing_agent, missing_skill, invalid_fallback, harness_not_ready, version_untested, external_edit_invalid, other] }
        message: { type: string, description: "The en-US text, or the agent's own words, which have no messageKey." }
        messageKey: { $ref: "#/components/schemas/MessageKey" }
        params: { $ref: "#/components/schemas/MessageParams" }
        subject: { type: string }

    ExecutionRef:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/ExecutionStatus" }
        createdAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }

    TaskSummary:
      type: object
      required: [id, name, type, enabled, revision, harness, warnings]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        type: { type: string }
        enabled: { type: boolean }
        revision: { type: string }
        harness: { type: string }
        fallbackHarnesses: { type: array, items: { type: string } }
        schedule: { type: string, description: The cron expression or interval, if any. }
        timezone: { type: string }
        nextFireAt: { type: string, format: date-time }
        running: { type: boolean }
        queued: { type: boolean }
        deletePending: { type: boolean }
        repositories: { type: array, items: { type: string } }
        lastExecution: { $ref: "#/components/schemas/ExecutionRef" }
        warnings: { type: array, items: { $ref: "#/components/schemas/Warning" } }
        invalid: { type: boolean, description: The file on disk fails validation; the last valid definition is in use. }

    Task:
      allOf:
        - $ref: "#/components/schemas/TaskSummary"
        - type: object
          required: [document, yaml, effective, path]
          properties:
            document: { $ref: "#/components/schemas/TaskDocument" }
            effective: { $ref: "#/components/schemas/TaskDocument" }
            yaml: { type: string }
            path: { type: string }
            validation: { $ref: "#/components/schemas/ValidationResult" }

    ScheduleInput:
      type: object
      properties:
        cron: { type: string }
        interval: { type: string }
        timezone: { type: string }

    SchedulePreview:
      type: object
      required: [occurrences]
      properties:
        occurrences: { type: array, items: { type: string, format: date-time } }
        timezone: { type: string }
        error: { type: string, description: "Why the schedule is invalid, in en-US." }
        errorKey: { $ref: "#/components/schemas/MessageKey" }
        errorParams: { $ref: "#/components/schemas/MessageParams" }

    FiringResult:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [started, queued, coalesced, skipped] }
        executionId: { type: string }

    ExecutionStatus:
      type: string
      enum: [queued, preparing, running, switching_harness, testing, publishing, completed, no_work, failed, cancelled, interrupted, needs_attention]

    Trigger:
      type: string
      enum: [manual, schedule, catch_up]

    Attempt:
      type: object
      required: [number, harness, configuredModel, configuredEffort, startedAt]
      properties:
        number: { type: integer }
        harness: { type: string, description: "Empty for a script task's attempt, which runs a program instead of a harness." }
        harnessVersion: { type: string }
        model: { type: string, description: "The model the harness reported using; absent when it reported none." }
        effort: { type: string, description: "The effort the harness reported using; absent when it reported none." }
        configuredModel: { type: string, description: "The model the task asked for, default when it set none. Never the one used." }
        configuredEffort: { type: string, description: "The effort the task asked for, default when it set none. Never the one used." }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        outcome: { type: string, enum: [running, succeeded, failed, quota_exhausted, rate_limited, harness_unavailable, network_failed, timed_out, cancelled, interrupted] }
        exitCode: { type: integer }
        sessionId: { type: string }
        errorMessage: { type: string, description: "Why the attempt ended: the daemon's text in en-US, or the harness's own error, which has no errorKey." }
        errorKey: { $ref: "#/components/schemas/MessageKey" }
        errorParams: { $ref: "#/components/schemas/MessageParams" }
        reason: { type: string, description: "Why the attempt started — first, failover, rate-limit retry — in en-US." }
        reasonKey: { $ref: "#/components/schemas/MessageKey" }
        reasonParams: { $ref: "#/components/schemas/MessageParams" }
        usage: { $ref: "#/components/schemas/AttemptUsage" }
        prompt:
          type: string
          description: >-
            The task's prompt as the attempt sent it to the harness, redacted like the raw output; a later edit of the task
            does not change it. Absent on older records.
        sessionContext:
          type: string
          description: >-
            HarmFlow's session context the attempt sent with the prompt, composed for that attempt and redacted like the
            raw output. Absent on older records.
        process:
          type: object
          description: >-
            The harness process the attempt started, recorded as soon as it starts: its pid, the process group it leads,
            and its start time as the kernel recorded it, so a daemon that restarts after a crash ends it and what it
            started, and nothing else. Absent when no harness process started, and on older records.
          required: [pid, group, startedAt]
          properties:
            pid: { type: integer }
            group: { type: integer }
            startedAt: { type: string, format: date-time }

    AttemptUsage:
      type: object
      description: >-
        What the harness reported of the attempt's token use: the count so far while it runs, the final one when it ends.
        The cost is stamped when the attempt ends — the harness's own figure, or an estimate from the adapter's dated table
        of API list prices — so a later table never reprices it. Numbers and enums only; the desktop words them.
        Absent when the attempt started no harness process; older records have none.
      required: [status, models]
      properties:
        status:
          type: string
          enum: [reported, partial, not_reported]
          description: >-
            reported: the harness's final count. partial: the count so far, without the harness's final line, so output
            tokens are unknown and there is no cost. not_reported: the harness reported no usage, which is not zero.
        modelSource:
          type: string
          enum: [harness, task, config]
          description: Where the model was named — the harness's output, the task, or the harness's configuration for a task left at the default.
        models: { type: array, items: { $ref: "#/components/schemas/ModelUsage" } }
        costSource:
          type: string
          enum: [reported, estimated, unpriced]
          description: Set on a reported usage. reported — printed by the harness; estimated — tokens at the price table; unpriced — the model is unknown or has no price.
        costUsd: { type: number, description: "The attempt's cost in USD, when costSource is reported or estimated." }
        pricesAsOf: { type: string, format: date, description: "The date of the price table the attempt ended with." }

    ModelUsage:
      type: object
      required: [tokens]
      properties:
        model: { type: string, description: "The full model id; absent when nothing names it." }
        tokens: { $ref: "#/components/schemas/TokenCounts" }
        price: { $ref: "#/components/schemas/TokenPrice" }
        costUsd: { type: number, description: "This model's cost in USD, reported by the harness or estimated from price." }

    TokenCounts:
      type: object
      description: >-
        Tokens by class. input excludes the tokens written to and read from the cache. cacheWriteShort is written at the
        provider's default cache lifetime (Anthropic 5 minutes, OpenAI 30 minutes), cacheWriteLong at its extended one
        (Anthropic 1 hour, OpenAI 12 hours).
      required: [input, cacheWriteShort, cacheWriteLong, cacheRead, output]
      properties:
        input: { type: integer, format: int64 }
        cacheWriteShort: { type: integer, format: int64 }
        cacheWriteLong: { type: integer, format: int64 }
        cacheRead: { type: integer, format: int64 }
        output: { type: integer, format: int64 }

    TokenPrice:
      type: object
      description: A model's API list price by token class, in USD per million tokens.
      required: [input, cacheWriteShort, cacheWriteLong, cacheRead, output]
      properties:
        input: { type: number }
        cacheWriteShort: { type: number }
        cacheWriteLong: { type: number }
        cacheRead: { type: number }
        output: { type: number }

    WorkItemResult:
      type: object
      required: [key]
      properties:
        key: { type: string }
        kind: { type: string }
        repository: { type: string }
        issueNumber: { type: integer }
        title: { type: string }
        branch: { type: string }
        worktreePath: { type: string }
        outcome: { type: string }
        pullRequest:
          type: object
          properties:
            number: { type: integer }
            url: { type: string }
            draft: { type: boolean }
            created: { type: boolean }
        tests:
          type: object
          properties:
            status: { type: string, enum: [passed, failed, not_run] }
            summary: { type: string }
        commits: { type: array, items: { type: string } }
        changedFiles: { type: array, items: { type: string } }

    ExecutionSummary:
      type: object
      required: [id, taskId, taskName, taskType, status, trigger, createdAt, harness]
      properties:
        id: { type: string }
        taskId: { type: string }
        taskName: { type: string }
        taskType: { type: string }
        status: { $ref: "#/components/schemas/ExecutionStatus" }
        trigger: { $ref: "#/components/schemas/Trigger" }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        harness: { type: string, description: "The harness of the current or last attempt; empty for a script task." }
        model: { type: string, description: "The model the current or last attempt's harness reported using; absent when it reported none." }
        attemptCount: { type: integer }
        currentStep:
          type: string
          description: >-
            The latest step; no percentage is invented. The daemon's own step is in en-US, beside its currentStepKey;
            the agent's and a tool's have none.
        currentStepKey: { $ref: "#/components/schemas/MessageKey" }
        currentStepParams: { $ref: "#/components/schemas/MessageParams" }
        repository: { type: string }
        workItem: { type: string }
        pullRequestUrl: { type: string }
        testsStatus: { type: string, enum: [passed, failed, not_run] }
        summary: { type: string }
        errorMessage: { type: string, description: "Why the execution ended: the daemon's text in en-US, or the agent's or harness's own words, which have no errorKey." }
        errorKey: { $ref: "#/components/schemas/MessageKey" }
        errorParams: { $ref: "#/components/schemas/MessageParams" }
        warningCount: { type: integer }

    Execution:
      allOf:
        - $ref: "#/components/schemas/ExecutionSummary"
        - type: object
          required: [attempts, workItems, warnings, changedFiles, commands]
          properties:
            scheduledFor: { type: string, format: date-time }
            cancelRequestedAt: { type: string, format: date-time }
            timeoutAt: { type: string, format: date-time }
            definitionRevision: { type: string }
            workspacePath: { type: string }
            executionDir: { type: string }
            attempts: { type: array, items: { $ref: "#/components/schemas/Attempt" } }
            workItems: { type: array, items: { $ref: "#/components/schemas/WorkItemResult" } }
            warnings: { type: array, items: { $ref: "#/components/schemas/Warning" } }
            changedFiles: { type: array, items: { type: string } }
            commands:
              type: array
              items:
                type: object
                required: [id, command, status]
                properties:
                  id: { type: string }
                  command: { type: string }
                  status: { type: string, enum: [running, succeeded, failed] }
                  exitCode: { type: integer }
                  startedAt: { type: string, format: date-time }
                  endedAt: { type: string, format: date-time }
                  attempt: { type: integer }
            lastOperation: { type: string }
            logExpired: { type: boolean }
            script: { $ref: "#/components/schemas/ScriptRun" }

    ScriptRun:
      description: >-
        The program a script task's execution ran, as it ran, redacted like the raw output; absent for every other type.
        A script execution has one attempt, with no harness.
      type: object
      required: [program, workingDirectory]
      properties:
        command: { type: array, items: { type: string }, description: "The argument list, started with no shell." }
        interpreter: { type: array, items: { type: string }, description: "The interpreter of an inline script, with its arguments." }
        source: { type: string, description: "The inline script, as it ran." }
        scriptPath: { type: string, description: "The file in the execution's directory the inline script was written to." }
        program: { type: string, description: "The path of the program started." }
        workingDirectory: { type: string }
        environment: { type: object, additionalProperties: { type: string }, description: "The task's own variables." }
        exitCode: { type: integer, description: "128 plus the signal's number when a signal ended the program." }
        signal: { type: string, description: "The signal that ended the program, such as SIGKILL; absent when it exited by itself." }
        process:
          type: object
          description: The program's process group while it runs, so a restarted daemon ends what it left.
          required: [group, leaderStart, boot]
          properties:
            group: { type: integer }
            leaderStart: { type: string }
            boot: { type: string }

    ExecutionOutput:
      type: object
      required: [attempts, logExpired]
      properties:
        attempts: { type: array, items: { $ref: "#/components/schemas/AttemptOutput" } }
        logExpired: { type: boolean }

    AttemptOutput:
      type: object
      required: [attempt, harness, size, offset, text]
      properties:
        attempt: { type: integer }
        harness: { type: string }
        size: { type: integer, description: Bytes in the whole capture. }
        offset: { type: integer, description: Where text starts in the capture; above 0 when its beginning is left out. }
        text: { type: string }

    Event:
      description: contracts/schemas/event.schema.json.
      type: object
      required: [id, schemaVersion, timestamp, type, severity]
      properties:
        id: { type: integer }
        schemaVersion: { type: string }
        timestamp: { type: string, format: date-time }
        taskId: { type: string }
        executionId: { type: string }
        workItemId: { type: string }
        attempt: { type: integer }
        harness: { type: string }
        type: { type: string }
        severity: { type: string, enum: [debug, info, warning, error] }
        message: { type: string, description: "The daemon's text in en-US, or the agent's or a tool's own words, which have no messageKey." }
        messageKey: { $ref: "#/components/schemas/MessageKey" }
        params: { $ref: "#/components/schemas/MessageParams" }
        payload:
          type: object
          additionalProperties: true
          description: An error in the payload is a text too, with errorKey and errorParams beside it.

    Queue:
      type: object
      required: [waiting, upcoming, workItems]
      properties:
        waiting:
          description: Firings waiting for their task's running execution (at most one per task).
          type: array
          items: { $ref: "#/components/schemas/ExecutionSummary" }
        upcoming:
          type: array
          items:
            type: object
            required: [taskId, taskName, nextFireAt]
            properties:
              taskId: { type: string }
              taskName: { type: string }
              harness: { type: string }
              nextFireAt: { type: string, format: date-time }
        workItems:
          type: array
          items: { $ref: "#/components/schemas/WorkItem" }

    WorkItem:
      description: The daemon's ledger of a task's work items, built from the reports its sessions leave.
      type: object
      required: [taskId, key, status, resumes, failures, updatedAt]
      properties:
        taskId: { type: string }
        key: { type: string }
        title: { type: string }
        repository: { type: string }
        status: { type: string, enum: [in_progress, completed, failed, needs_attention, closed] }
        resumes: { type: integer }
        failures: { type: integer }
        branch: { type: string }
        pullRequestUrl: { type: string }
        testsStatus: { type: string }
        lastExecutionId: { type: string }
        lastOperation: { type: string }
        updatedAt: { type: string, format: date-time }

    Settings:
      type: object
      required: [language, trayEnabled, keepTrayOnQuit, notificationLevel, logRetentionDays, autostart, pathVariables,
        allowedFolders, onboardingCompleted]
      properties:
        language: { type: string, enum: [pt-BR, en-US, es-ES, system] }
        trayEnabled: { type: boolean, default: true }
        keepTrayOnQuit:
          description: >-
            While the tray is shown, ⌘Q and Quit in the app menu only hide the dashboard, as closing its window does.
            Quit from the Dock, logging out, and the tray's own Quit still end the desktop.
          type: boolean
          default: false
        notificationLevel: { type: string, enum: [all, failures_and_attention, none], default: all }
        logRetentionDays: { type: integer, minimum: 1, maximum: 3650, default: 30 }
        theme: { type: string, enum: [harmflow-dark], default: harmflow-dark }
        autostart:
          type: object
          required: [enabled, mechanism]
          properties:
            enabled: { type: boolean }
            mechanism: { type: string, enum: [launchd, none] }
            plistPath: { type: string }
        pathVariables:
          description: Values for ${NAME} references in task paths, such as PROJECTS_ROOT.
          type: object
          additionalProperties: { type: string }
        allowedFolders:
          description: >-
            Folders, beside the user's home folder and the mounted volumes, where a task's workspace, its repositories'
            local paths, and a custom profile's writable paths may lead. Absolute, or starting with ~; none may be the
            home folder or contain it, nor lie inside HarmFlow's data directory, ~/Library, or a hidden folder at the
            top of the home folder.
          type: array
          items: { type: string }
        onboardingCompleted: { type: boolean }

    SettingsPatch:
      type: object
      properties:
        language: { type: string, enum: [pt-BR, en-US, es-ES, system] }
        trayEnabled: { type: boolean }
        keepTrayOnQuit: { type: boolean }
        notificationLevel: { type: string, enum: [all, failures_and_attention, none] }
        logRetentionDays: { type: integer, minimum: 1, maximum: 3650 }
        autostart: { type: boolean }
        pathVariables:
          type: object
          additionalProperties: { type: string }
        allowedFolders:
          description: Replaces the whole list. Refused when it would put a saved task's path outside the rule.
          type: array
          items: { type: string }
        onboardingCompleted: { type: boolean }

    CleanResult:
      type: object
      required: [removed, kept]
      properties:
        removed: { type: array, items: { type: string } }
        kept:
          type: array
          items:
            type: object
            required: [path, reason]
            properties:
              path: { type: string }
              reason: { type: string }

    Notification:
      type: object
      required: [id, createdAt, eventType, title, body, read, severity]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        eventType: { type: string }
        taskId: { type: string }
        executionId: { type: string }
        title: { type: string }
        body: { type: string }
        severity: { type: string, enum: [info, warning, error] }
        read: { type: boolean }
        params:
          description: >-
            Values the desktop interpolates into its translated text for eventType; title and body are the en-US
            fallback. The event's message is in the param the text names, error or reason, nested as in MessageParams
            when the daemon wrote it; a completed execution's summary is in summary.
          type: object
          additionalProperties: { type: string }
